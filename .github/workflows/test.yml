# Build ardopb + the host-client apps, run the full verification sweep on Linux
# and Windows, and publish fresh binaries for Windows, Linux x86-64 and Linux
# arm64.
#
# The whole tree builds at -Wall -Wextra -Werror, so there is nothing to
# suppress and no warning census to keep -- a failed build IS the census.
#
# The build jobs are not redundant. The Linux job owns the mechanical guarantees
# (check-pure, check-standalone and the ThreadSanitizer run all read ELF or need
# a sanitizer MinGW does not have); they prove properties of source that both
# platforms share, so proving them once is enough (analysis/14 Decision 6). The
# Windows job proves the portable set really is portable, under a different GCC
# major version than ubuntu-latest ships -- which catches a class of warning the
# Linux job structurally cannot. The package-linux jobs own the two things only
# they can see: what glibc the shipped tarball actually demands, and whether the
# waveform survives a target whose baseline has FMA (see that job's comment).

name: test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A second push to main must not race the first for the `continuous` tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcmocka-dev qt6-base-dev \
            cmake ninja-build

      - name: Build (ardopb, apps, spine)
        run: make

      - name: Core guarantees
        run: make check-pure check-headers check-standalone

      - name: Unit and integration tests
        run: make test-core

      # The SPSC ring's release/acquire pairing cannot be shown from one thread,
      # and MinGW has no ThreadSanitizer. The ring is portable C11 with no
      # platform code, so proving the ordering here proves it everywhere.
      - name: Ring ordering under ThreadSanitizer
        run: make test-ring-tsan

      # analysis/14 Decision 2 -- "nothing outside the modem thread touches the
      # runtime, for any reason, ever" -- is a claim about what does not happen,
      # which no single-threaded test can support. This runs a whole ARQ session
      # on one thread while another drives the seam, with core/ and shell/
      # compiled from source under the sanitizer so their silence means
      # something. It also builds app/ at -O1, which catches a class of warning
      # the unoptimised default build structurally cannot.
      - name: Spine threading under ThreadSanitizer
        run: make test-app-tsan

      # The spine, driven headless through a scripted command queue: connect,
      # transfer under backpressure, verify every byte, disconnect. This is
      # analysis/14's exit criterion for workstream A, and it needs no radio.
      - name: Station spine, end to end
        run: |
          make app
          ./app/ardop-spine --loopback --telemetry \
            --script test/app/session.script

      # The device manager against a real backend. miniaudio's synthetic device
      # runs a real device thread, so this exercises the open, the platform
      # bind, the block the backend asked for and the credit -- on a runner with
      # no sound card. test_devices drives the manager as a library; this proves
      # the program built around it starts.
      - name: Device manager, end to end
        run: ./app/ardop-spine --audio-null-device --script test/app/devices.script

      # The two entry points an operator types first. Neither can assert much on
      # a runner with no audio hardware -- --detect exits 1 when it finds no
      # radio, which is correct there -- but "it ran, printed something and came
      # back" is exactly the class of regression that otherwise reaches a user
      # before it reaches us. The timeout is the real assertion: these must not
      # hang, and --detect walks a device tree.
      - name: Operator entry points
        run: |
          timeout 30 ./app/ardop-spine --list-devices > devices.txt; rc=$?
          test $rc -le 1 || { echo "--list-devices exited $rc"; exit 1; }
          timeout 30 ./app/ardop-spine --detect > detect.txt; rc=$?
          test $rc -le 1 || { echo "--detect exited $rc"; exit 1; }
          test -s devices.txt || { echo "--list-devices printed nothing"; exit 1; }
          test -s detect.txt || { echo "--detect printed nothing"; exit 1; }
          cat devices.txt detect.txt

      - name: Golden-corpus conformance
        run: make golden-core golden-shell golden-tx

      # The same corpus through interpolate-then-decimate, at the ratios a real
      # sound card gives. The -alias variant adds an out-of-band interferer that
      # naive decimation folds into the middle of the passband, so a decimator
      # with no anti-alias filter passes the first and fails the second.
      - name: Resampler against the corpus
        run: make golden-resample golden-resample-alias

      - name: Build the GUI
        run: |
          cmake -S gui -B gui/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build gui/build

  # The Linux tarballs, built where they must be built rather than where the
  # tests happen to run.
  #
  # ubuntu-22.04 and not ubuntu-latest: nothing here links beyond libm and libc
  # -- miniaudio dlopen()s ALSA, PulseAudio and JACK at run time -- so the only
  # thing deciding how widely the tarball runs is the build machine's glibc.
  # 22.04 puts the floor at GLIBC_2.34, which covers Debian 12, Ubuntu 22.04+
  # and Raspberry Pi OS bookworm. Building on ubuntu-latest would raise that
  # floor for no gain and break machines that work today.
  #
  # The arm64 job is not just a second package. core/ has no architecture-
  # specific code and no -march flag, but aarch64 has FMA in its baseline where
  # x86-64 does not, so GCC's default -ffp-contract=fast can fuse a multiply
  # and an add there and round differently. That is exactly the class of
  # difference that would move the on-air waveform. Running the golden suites
  # here is what proves it does not -- do not reduce this job to a build.
  package-linux:
    name: package-linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      # Unshallow: tools/package-linux.sh puts `git describe` in VERSION, and
      # a build with no identity is a bug report nobody can act on.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcmocka-dev

      # `make` builds app/ too, which is not shipped in the tarball -- the
      # packaging script names its four binaries explicitly. It is built here
      # anyway because aarch64 is the only place the spine's size_t arithmetic
      # gets compiled for a different word layout than the developer's machine.
      - name: Build (ardopb, apps, spine)
        run: make

      - name: Unit and integration tests
        run: make test-core

      - name: Golden-corpus conformance
        run: make golden-core golden-shell golden-tx

      - name: Package
        run: tools/package-linux.sh dist

      - uses: actions/upload-artifact@v4
        with:
          name: ardopb-linux-${{ matrix.arch }}
          path: ardopb-linux-${{ matrix.arch }}.tar.gz
          retention-days: 30

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # Unshallow: tools/package-windows.sh puts `git describe` in VERSION.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            zip
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmocka
            mingw-w64-x86_64-python
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-tools

      - name: Build (ardopb, apps, spine)
        run: make

      - name: Unit and integration tests
        run: make test-core

      # Running the spine on Windows, not merely compiling it. The whole reason
      # this job exists is that portability is a claim about behaviour, and the
      # loopback session is the one test that drives a complete ARQ exchange --
      # connect, transfer under backpressure, verify every byte, disconnect --
      # with no radio. A build that compiles and cannot complete a session is
      # exactly the failure a compile-only job cannot see.
      - name: Station spine, end to end
        run: |
          make app
          ./app/ardop-spine --loopback --telemetry \
            --script test/app/session.script
          ./app/ardop-spine --audio-null-device --script test/app/devices.script

      # Worth stating plainly: golden-tx passing here means the modulator emits
      # byte-identical on-air audio compiled by a different toolchain on a
      # different OS. If it ever diverges it is a float or integer-promotion
      # difference in core/modem/modulate.c and a real interop defect -- do not
      # mark it flaky.
      - name: Golden-corpus conformance
        run: make golden-core golden-shell golden-tx

      - name: Build the GUI
        run: |
          cmake -S gui -B gui/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build gui/build

      - name: Package
        run: tools/package-windows.sh dist

      # Two artifacts, not one. The modem and the apps are statically linked
      # and come to under 300 KB zipped; the panel drags in Qt, ICU and the
      # rest of the chain and is about a hundred times that. Shipping them
      # together made every headless operator download Qt to get a 600 KB
      # modem. See tools/package-windows.sh.
      - uses: actions/upload-artifact@v4
        with:
          name: ardopb-windows-x86_64
          path: ardopb-windows-x86_64.zip
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: ardop-gui-windows-x86_64
          path: ardop-gui-windows-x86_64.zip
          retention-days: 30

  # A rolling build of main, so an operator can get a current binary from a
  # stable URL without a GitHub account:
  #
  #   .../releases/download/continuous/ardopb-windows-x86_64.zip
  #   .../releases/download/continuous/ardopb-linux-aarch64.tar.gz
  #
  # `needs` is the gate: a failing test on *any* platform blocks publication.
  publish-continuous:
    needs: [linux, package-linux, windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # merge-multiple flattens every artifact into one directory, so adding a
      # platform above needs no change here.
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Move the continuous tag
        run: |
          git tag -f continuous ${{ github.sha }}
          git push -f origin continuous

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: Continuous build
          prerelease: true
          make_latest: false
          body: |
            Automatic build of `main` at ${{ github.sha }}.

            **This is not a release.** Two things are still open and both
            matter to an operator: memory-ARQ is not ported, so low-SNR
            performance is below the reference implementation's, and on-air
            interop against a real `ardopcf` peer has not been validated.
            The waveform and the decoder are checked against a frozen corpus
            on every build; a live negotiated session with a foreign
            implementation is not.

            | download | what it is |
            | --- | --- |
            | `ardopb-windows-x86_64.zip` | the station program, the modem and the host-client apps |
            | `ardopb-linux-x86_64.tar.gz` | the same, for a Linux PC |
            | `ardopb-linux-aarch64.tar.gz` | the same, for a 64-bit Raspberry Pi |
            | `ardop-gui-windows-x86_64.zip` | the instrument panel, and its Qt libraries |

            Start with `ardop-spine --detect`, which tries to work out which
            serial port belongs to your radio. **The keying paths have never
            been run against real hardware** -- `FIELD-TESTING.md` inside the
            download says what to try, in order of risk, and what to send back.

            You do not need the panel to run a link. The Linux tarballs need
            glibc 2.34 or newer (Debian 12, Ubuntu 22.04+, Raspberry Pi OS
            bookworm); the Linux GUI is built from source, see `gui/`.

            See the `README-WINDOWS.txt` or `README-LINUX.txt` inside the
            download to get started.
          files: |
            release/*.zip
            release/*.tar.gz

  publish-release:
    needs: [linux, package-linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*.zip
            release/*.tar.gz
