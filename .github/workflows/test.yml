# Build ardopb + the host-client apps and run the full verification sweep.
#
# The whole tree builds at -Wall -Wextra -Werror, so there is nothing to
# suppress and no warning census to keep -- a failed build IS the census.

name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libcmocka-dev

      - name: Build (ardopb + apps)
        run: make

      - name: Core guarantees
        run: make check-pure check-headers check-standalone

      - name: Unit and integration tests
        run: make test-core

      - name: Golden-corpus conformance
        run: make golden-core golden-shell golden-tx
